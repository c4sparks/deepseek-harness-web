<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DSH Chat</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: var(--vscode-font-family, system-ui, sans-serif);
    font-size: 13px; color: var(--vscode-foreground, #ddd);
    background: var(--vscode-editor-background, #1e1e1e);
  }
  body { display: flex; flex-direction: column; }

  /* 欢迎页（空状态） */
  #welcome {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px; text-align: center;
  }
  #welcome.hidden { display: none; }
  .welcome-title { font-size: 20px; font-weight: 600; }
  .welcome-desc { font-size: 13px; color: var(--vscode-descriptionForeground, #888); max-width: 90%; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 100%; }
  .suggestion {
    border: 1px solid var(--vscode-input-border, rgba(255,255,255,0.2));
    background: var(--vscode-button-secondaryBackground, rgba(255,255,255,0.06));
    color: var(--vscode-button-secondaryForeground, #ccc);
    border-radius: 16px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .suggestion:hover { background: var(--vscode-button-secondaryHoverBackground, rgba(255,255,255,0.1)); }

  /* 消息列表 */
  #messages { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 16px; }
  #messages.hidden { display: none; }
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--vscode-badge-background, #3a3a3a); color: var(--vscode-foreground, #ccc); }
  .msg.assistant .avatar { background: var(--vscode-badge-background, #3a3a3a); color: var(--vscode-foreground, #ddd); }
  .msg .col { display: flex; flex-direction: column; gap: 4px; max-width: 86%; }
  .msg .name { display: none; } /* 默认隐藏 "你"/"dsh" 角色文字 */
  .msg.user .body {
    background: var(--vscode-input-background, #252526); border-radius: 10px;
    padding: 8px 10px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .body { white-space: normal; word-break: break-word; }
  .msg.user .body .user-text { white-space: pre-wrap; }
  .msg.user .body .user-img { margin-top: 6px; }
  .msg.user .body .user-img img {
    max-width: 100%; max-height: 240px; border-radius: 8px; display: block;
    border: 1px solid var(--vscode-panel-border, rgba(255,255,255,0.12));
  }

  /* markdown 内容 */
  .msg .body p { margin: 0 0 8px; }
  .msg .body p:last-child { margin-bottom: 0; }
  .msg .body pre {
    background: var(--vscode-textCodeBlock-background, rgba(0,0,0,0.3));
    padding: 8px 10px; border-radius: 6px; overflow-x: auto; font-size: 12px;
    font-family: var(--vscode-editor-font-family, monospace);
  }
  .msg .body code { font-family: var(--vscode-editor-font-family, monospace); font-size: 12px; }
  .msg .body ul, .msg .body ol { margin: 0 0 8px; padding-left: 20px; }
  .msg .body a { color: var(--vscode-textLink-foreground, #4daafc); }
  .msg .body blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid rgba(255,255,255,0.2); color: var(--vscode-descriptionForeground, #888); }

  /* 输入区 */
  #composer {
    position: relative;
    padding: 8px 12px;
    background: var(--vscode-editor-background, #1e1e1e);
  }
  #inputbox {
    display: flex; flex-direction: column;
    border: 1px solid var(--vscode-input-border, rgba(128,128,128,0.45));
    border-radius: 10px; background: var(--vscode-input-background, #252526);
  }
  #inputbox:focus-within { border-color: var(--vscode-focusBorder, #4daafc); }
  #input {
    width: 100%; box-sizing: border-box; resize: none; border: none; outline: none;
    min-height: 56px; max-height: 150px; background: transparent;
    color: var(--vscode-input-foreground, #ddd); padding: 10px 14px 4px;
    font-family: inherit; font-size: 13px;
  }
  #inputbar {
    display: flex; align-items: center; gap: 4px;
    padding: 2px 10px 6px 2px;
  }
  #attach, #permBtn, #modelBtn {
    width: 22px; height: 22px; border: none; background: none;
    color: var(--vscode-foreground, #ddd); cursor: pointer; border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
    flex: none; line-height: 0;
  }
  #attach svg, #permBtn svg, #modelBtn svg { display: block; }
  #permBtn, #modelBtn { font-size: 15px; line-height: 1; }
  #attach, #permBtn, #modelBtn { border-radius: 6px; transition: background 0.12s ease; }
  #attach:hover, #permBtn:hover, #modelBtn:hover {
    background: rgba(128,128,128,0.28);
  }
  #permBtn.active, #modelBtn.active { background: rgba(128,128,128,0.35); }
  /* 图标 + 选择文字作为一个紧凑单元；窄面板可收缩/换行，避免把右侧按钮挤出可视区 */
  #composer, #inputbox, #inputbar { min-width: 0; }
  .sel-group { display: inline-flex; align-items: center; gap: 3px; flex: 0 1 auto; min-width: 0; }
  .sel-label {
    font-size: 11px; color: var(--vscode-descriptionForeground, #888);
    min-width: 0; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 模型标签：宽裕时完整显示，随面板变窄单行收缩并出省略号（不竖排、不横向溢出） */
  #modelLabel { max-width: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 图标点击后向上展开的选择面板 */
  .popup {
    position: absolute; bottom: 100%; left: 8px; z-index: 50;
    min-width: 180px; max-width: 300px; max-height: 46vh; overflow-y: auto;
    background: var(--vscode-editor-background, #1e1e1e);
    border: 1px solid var(--vscode-panel-border, rgba(255,255,255,0.15));
    border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    padding: 6px; display: flex; flex-direction: column; gap: 1px;
  }
  .popup.hidden { display: none; }
  .popup .popup-title { font-size: 11px; opacity: 0.7; padding: 2px 6px 4px; }
  .popup .optgroup-label { font-size: 11px; opacity: 0.6; padding: 4px 6px 2px; }
  .popup .opt {
    display: flex; align-items: center; font-size: 12px;
    padding: 5px 8px; border-radius: 5px; cursor: pointer;
  }
  .popup .opt:hover { background: rgba(255,255,255,0.08); }
  .popup .opt.selected {
    background: var(--vscode-button-background, #0e639c);
    color: var(--vscode-button-foreground, #fff);
  }
  .popup .opt.reason { padding-left: 18px; font-size: 11px; }
  #send {
    margin-left: auto;
    width: 24px; height: 24px; border-radius: 50%; border: none;
    background: var(--vscode-button-background, #0e639c); color: var(--vscode-button-foreground, #fff);
    cursor: pointer; flex: none; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
  }
  #send:hover { background: var(--vscode-button-hoverBackground, #1177bb); }
  #send:disabled { opacity: 0.4; cursor: default; }
  #send.stop { background: var(--vscode-errorForeground, #f14c4c); }
  #send.stop { font-size: 10px; }

  /* 统计脚注 */
  .stats {
    font-size: 11px; color: var(--vscode-descriptionForeground, #888);
    opacity: 0.8; margin-top: 2px;
  }

  /* 审批行 */
  .approval {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255, 193, 7, 0.1); border: 1px solid rgba(255, 193, 7, 0.3);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; margin: 6px 0;
  }
  .approval .desc { flex: 1; word-break: break-word; }
  .approval button {
    border: 1px solid var(--vscode-input-border, rgba(255,255,255,0.15));
    background: none; color: var(--vscode-foreground, #ddd);
    font-size: 12px; padding: 3px 14px; border-radius: 4px; cursor: pointer;
  }
  .approval button:hover { background: rgba(255,255,255,0.1); }
  .approval button.allow { color: #4daafc; border-color: rgba(77,170,252,0.4); }
  .approval button.reject { color: #ff5c5c; border-color: rgba(255,92,92,0.4); }

  /* 提问卡（ask_user_question） */
  .question {
    background: rgba(77, 170, 252, 0.08); border: 1px solid rgba(77, 170, 252, 0.3);
    border-radius: 8px; padding: 10px 12px; font-size: 12px; margin: 6px 0;
  }
  .question .q-title { font-weight: 600; margin-bottom: 6px; }
  .question .q-block { margin: 6px 0; }
  .question .q-header { font-size: 11px; opacity: 0.7; }
  .question .q-text { font-weight: 500; margin: 2px 0; }
  .question .q-detail { font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
  .question .q-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .question .q-option {
    border: 1px solid var(--vscode-input-border, rgba(255,255,255,0.2));
    background: none; color: var(--vscode-foreground, #ddd);
    font-size: 12px; padding: 4px 12px; border-radius: 14px; cursor: pointer;
  }
  .question .q-option:hover { background: rgba(255,255,255,0.1); }
  .question .q-option.selected {
    background: var(--vscode-button-background, #0e639c);
    color: var(--vscode-button-foreground, #fff); border-color: transparent;
  }
  .question .q-input {
    width: 100%; box-sizing: border-box; margin-top: 4px;
    border: 1px solid var(--vscode-input-border, rgba(255,255,255,0.2));
    border-radius: 6px; padding: 5px 8px; background: var(--vscode-input-background, #252526);
    color: var(--vscode-input-foreground, #ddd); font-size: 12px;
  }
  .question .q-bar { display: flex; gap: 8px; margin-top: 8px; }
  .question button.q-submit {
    background: var(--vscode-button-background, #0e639c); color: var(--vscode-button-foreground, #fff);
    border: none; border-radius: 4px; padding: 4px 16px; font-size: 12px; cursor: pointer;
  }
  .question button.q-submit:hover { background: var(--vscode-button-hoverBackground, #1177bb); }
  .question button.q-cancel {
    border: 1px solid var(--vscode-input-border, rgba(255,255,255,0.2)); background: none;
    color: var(--vscode-foreground, #ddd); border-radius: 4px; padding: 4px 16px; font-size: 12px; cursor: pointer;
  }
  .question button.q-cancel:hover { background: rgba(255,255,255,0.1); }

  /* 思考 / 活动（实时，思维链） */
  .thinking { font-size: 11px; color: var(--vscode-descriptionForeground, #888); }
  .thinking.hidden { display: none; }
  .thinking .act { margin: 1px 0; }
  .thinking .thinking-dots { animation: dsh-pulse 1.2s ease-in-out infinite; }
  @keyframes dsh-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  .thinking .summary { font-style: italic; }

  /* 思维链：每个 step 一个块（思考文本 + 工具 chips） */
  .thinking .step-box {
    margin: 4px 0; padding: 5px 8px;
    border: 1px solid var(--vscode-panel-border, rgba(255,255,255,0.12));
    border-left: 3px solid var(--vscode-charts-blue, #4daafc);
    border-radius: 6px;
    background: rgba(255,255,255,0.03);
  }
  .thinking .step-head { font-weight: 600; opacity: 0.9; margin-bottom: 2px; }
  .thinking .step-reasoning { white-space: pre-wrap; opacity: 0.75; margin: 2px 0; }
  .thinking .step-tools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .thinking .tool-chip {
    font-size: 10px; padding: 1px 7px; border-radius: 8px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.18);
  }

  /* 消息时间 + 操作（悬停显示） */
  .msg-meta {
    display: flex; align-items: center; gap: 6px; font-size: 11px;
    color: var(--vscode-descriptionForeground, #888); opacity: 0; transition: opacity 0.15s;
  }
  .msg:hover .msg-meta { opacity: 1; }
  .msg-meta .time { font-variant-numeric: tabular-nums; }

  /* 消息操作按钮 */
  .msg-actions { display: flex; gap: 2px; }
  .msg-actions button {
    border: none; background: none; color: var(--vscode-descriptionForeground, #888);
    font-size: 12px; cursor: pointer; padding: 2px 5px; border-radius: 4px; line-height: 1;
  }
  .msg-actions button:hover { color: var(--vscode-foreground, #ddd); }

  /* 底部官方统计（左对齐，超长省略，悬停显示全文） */
  #statsbar {
    padding: 2px 12px 0; font-size: 11px;
    color: var(--vscode-descriptionForeground, #888);
    text-align: left; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: default;
  }
  #statsbar:empty { padding: 0; }

  /* 附件（文件引用，输入框区域内） */
  #attachments { padding: 0 0 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  #attachments.hidden { display: none; }
  .file-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--vscode-button-secondaryBackground, rgba(255,255,255,0.08));
    color: var(--vscode-button-secondaryForeground, #ccc);
    border: 1px solid var(--vscode-input-border, rgba(255,255,255,0.25));
    border-radius: 6px; padding: 3px 8px; font-size: 12px; max-width: 220px;
  }
  .file-chip .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip .x { cursor: pointer; opacity: 0.7; flex-shrink: 0; }
  .file-chip .x:hover { opacity: 1; }

  /* 图片附件缩略图 */
  .img-chip {
    display: inline-flex; align-items: flex-start; gap: 2px; position: relative;
    border: 1px solid var(--vscode-input-border, rgba(255,255,255,0.25));
    border-radius: 6px; padding: 2px;
  }
  .img-chip .img-thumb {
    width: 56px; height: 56px; object-fit: cover; border-radius: 4px; display: block;
  }
  .img-chip .x {
    position: absolute; top: -6px; right: -6px;
    width: 16px; height: 16px; line-height: 14px; text-align: center;
    border-radius: 50%; background: var(--vscode-button-secondaryBackground, #444);
    color: var(--vscode-foreground, #ddd); font-size: 11px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.3);
  }

  /* ---------- 通用弹窗（modal）：本插件所有确认/提示类弹层统一复用此样式 ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 18px; background: rgba(0, 0, 0, 0.35);
  }
  .modal.hidden { display: none; }
  .modal-card {
    width: 100%; max-width: 300px;
    background: var(--vscode-editor-background, #252526);
    border: 1px solid var(--vscode-panel-border, rgba(255,255,255,0.15));
    border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  .modal-head { display: flex; gap: 10px; align-items: flex-start; }
  .modal-icon {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid transparent;
  }
  .modal-icon--warn { color: #ffc107; background: rgba(255, 193, 7, 0.14); border-color: rgba(255, 193, 7, 0.35); }
  .modal-icon--info { color: #4daafc; background: rgba(77, 170, 252, 0.12); border-color: rgba(77, 170, 252, 0.35); }
  .modal-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .modal-sub { font-size: 11px; color: var(--vscode-descriptionForeground, #888); }
  .modal-code {
    font-size: 12px; word-break: break-all;
    background: var(--vscode-input-background, #1e1e1e);
    border: 1px solid var(--vscode-input-border, rgba(255,255,255,0.15));
    border-radius: 6px; padding: 6px 9px;
    font-family: var(--vscode-editor-font-family, monospace);
  }
  .modal-code.hidden { display: none; }
  .modal-body { font-size: 12px; line-height: 1.55; color: var(--vscode-foreground, #ddd); }
  .modal-ack {
    display: flex; align-items: flex-start; gap: 6px;
    font-size: 12px; color: var(--vscode-foreground, #ddd); cursor: pointer;
  }
  .modal-ack input { margin-top: 2px; accent-color: var(--vscode-focusBorder, #4daafc); }
  .modal-ack.hidden { display: none; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn {
    border-radius: 6px; padding: 5px 14px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .btn-ghost {
    background: none; color: var(--vscode-foreground, #ddd);
    border: 1px solid var(--vscode-input-border, rgba(255,255,255,0.22));
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); }
  .btn-primary {
    background: var(--vscode-button-background, #0e639c);
    color: var(--vscode-button-foreground, #fff); border: 1px solid transparent;
  }
  .btn-primary:hover { background: var(--vscode-button-hoverBackground, #1177bb); }
  .btn-danger {
    background: #d13438; /* 固定深红：浅色/深色主题都醒目 */
    color: #fff;
    border: 1px solid transparent;
  }
  .btn-danger:hover { background: #b52e31; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .modal button:focus-visible { outline: 1px solid var(--vscode-focusBorder, #4daafc); outline-offset: 1px; }
  @media (prefers-reduced-motion: no-preference) {
    .modal-card { animation: dsh-modal-in 0.16s ease-out; }
  }
  @keyframes dsh-modal-in {
    from { transform: translateY(6px) scale(0.98); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div id="welcome">
    <div class="welcome-title">AI 助手</div>
    <div class="welcome-desc">通过本地 DeepSeek Harness 对话。选中代码右键可 @ 到输入框。</div>
    <div class="suggestions">
      <button class="suggestion" data-p="请解释一下我选中的代码">解释选中代码</button>
      <button class="suggestion" data-p="请把这段代码重构得更清晰，并说明改动">重构这段代码</button>
      <button class="suggestion" data-p="请为这段代码写单元测试">写单元测试</button>
    </div>
  </div>

  <div id="messages" class="hidden"></div>

  <div id="composer">
    <div id="permPopup" class="popup hidden"></div>
    <div id="modelPopup" class="popup hidden"></div>
    <div id="attachments" class="hidden"></div>
    <div id="inputbox">
      <textarea id="input" placeholder="向 AI 提问（Ctrl+Enter 发送）"></textarea>
      <div id="inputbar">
        <button id="attach" title="添加文件/图片">＋</button>
        <div class="sel-group">
          <button id="permBtn" title="权限">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
          </button>
          <span id="permLabel" class="sel-label"></span>
        </div>
        <div class="sel-group">
          <button id="modelBtn" title="模型与推理等级">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>
          </button>
          <span id="modelLabel" class="sel-label"></span>
        </div>
        <button id="send" title="发送">↑</button>
      </div>
    </div>
  </div>

  <div id="statsbar"></div>

  <!-- 通用弹窗（dshModal：插件内所有确认/提示弹层，见 modal.ts 用法） -->
  <div id="dshModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="dshModalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <span id="dshModalIcon" class="modal-icon modal-icon--info" aria-hidden="true"></span>
        <div>
          <div id="dshModalTitle" class="modal-title"></div>
          <div id="dshModalSub" class="modal-sub"></div>
        </div>
      </div>
      <div id="dshModalCode" class="modal-code hidden"></div>
      <div id="dshModalBody" class="modal-body"></div>
      <label id="dshModalAck" class="modal-ack hidden">
        <input id="dshModalAckCheck" type="checkbox" />
        <span id="dshModalAckText"></span>
      </label>
      <div class="modal-actions">
        <button id="dshModalCancel" class="btn btn-ghost" type="button">Cancel</button>
        <button id="dshModalOk" class="btn btn-primary" type="button"></button>
      </div>
    </div>
  </div>

  <script src="./chat.js"></script>
</body>
</html>
